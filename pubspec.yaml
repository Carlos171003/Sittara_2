name: flutter_application_24
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  cupertino_icons: ^1.0.6
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  icons_plus: ^5.0.0
  maplibre_gl: ^0.24.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  http: ^1.6.0
  flutter_dotenv: ^6.0.0
  flutter_map: ^8.2.2
  url_launcher: ^6.3.2
  latlong2: ^0.9.1
  supabase_flutter: ^2.10.3
  app_links: ^6.4.1
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/Apoala.png
    - assets/images/Babes.png
    - assets/images/Bistrola 57.png
    - assets/images/Coyote Maya.png
    - assets/images/LogoFinal.png
    - assets/images/Pita Mediterranea.png
    - assets/images/Sittara.png
    - assets/images/Sittararemove.png

icons_launcher:
  image_path: "assets/images/ICON.png"
  platforms:
    android:
      enable: true
      adaptive_background_color: "#ffffff"
      adaptive_foreground_image: "assets/images/ICON.png"
    ios:
      enable: true